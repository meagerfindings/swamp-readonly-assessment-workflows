id: 135fed50-b533-4365-8999-1fa0417714cf
name: "@mgreten/readonly-feedback-triage"
description: >-
  Deterministically normalize and redact feedback before a bounded,
  recommendation-only readonly triage, then fail closed on invalid evidence or
  authority-bearing output.
tags:
  capability: readonly-feedback-triage
  authority: none
inputs:
  additionalProperties: false
  properties:
    requestId:
      type: string
      minLength: 1
      maxLength: 90
      pattern: ^[A-Za-z0-9][A-Za-z0-9_-]*$
    assessmentModel:
      type: string
      minLength: 1
      maxLength: 128
      pattern: ^[A-Za-z0-9][A-Za-z0-9._-]*$
    providerModel:
      type: string
      minLength: 1
      maxLength: 128
      pattern: ^[A-Za-z0-9][A-Za-z0-9._-]*$
    envelopes:
      type: array
      minItems: 1
      maxItems: 50
      items:
        type: object
        minProperties: 1
    policy:
      type: object
  required: [requestId, assessmentModel, providerModel, envelopes, policy]
jobs:
  - name: triage
    description: Redact raw feedback deterministically before any provider sees it.
    steps:
      - name: assert-input-scope
        description: Reject unsafe dynamic resource and model identifiers before any model dispatch.
        task: { type: assert, expr: 'inputs.requestId.matches("^[A-Za-z0-9][A-Za-z0-9_-]{0,89}$") && inputs.assessmentModel.matches("^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$") && inputs.providerModel.matches("^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$")', message: requestId or model identifier is outside the safe bounded identifier grammar., severity: high }
        dependsOn: []
        weight: 0
        allowFailure: false
      - name: assert-policy-contract
        description: Fail before feedback processing unless the caller declares the minimum readonly policy contract.
        task: { type: assert, expr: 'has(inputs.policy.personas) && size(inputs.policy.personas) > 0 && has(inputs.policy.redaction) && has(inputs.policy.redaction.profile) && size(inputs.policy.redaction.profile) > 0 && has(inputs.policy.tools) && inputs.policy.tools.mode == "readonly" && has(inputs.policy.sandbox) && inputs.policy.sandbox.required == true && inputs.policy.sandbox.credentialAccess == "provider" && has(inputs.policy.network) && (inputs.policy.network.mode == "deny" || (inputs.policy.network.mode == "allowlist" && has(inputs.policy.network.allowlist) && size(inputs.policy.network.allowlist) > 0))', message: Policy must declare personas, redaction, readonly tools, a required sandbox, provider-only credentials, and bounded network mode., severity: high }
        dependsOn: [{ step: assert-input-scope, condition: { type: succeeded } }]
        weight: 0
        allowFailure: false
      - name: normalize-and-redact
        description: Convert untrusted envelopes into bounded redacted artifacts without agent or provider tools.
        task:
          type: model_method
          modelIdOrName: "${{ inputs.assessmentModel }}"
          methodName: normalize
          inputs:
            requestId: "${{ inputs.requestId }}"
            envelopes: "${{ inputs.envelopes }}"
            policy: "${{ inputs.policy }}"
        dependsOn: [{ step: assert-policy-contract, condition: { type: succeeded } }]
        weight: 0
        allowFailure: false
      - name: prepare
        description: Reject artifacts that violate redaction, bounds, or readonly policy.
        task:
          type: model_method
          modelIdOrName: "${{ inputs.assessmentModel }}"
          methodName: prepare
          inputs:
            requestId: "${{ inputs.requestId }}"
            artifacts: '${{ data.latest(inputs.assessmentModel, "normalized-" + inputs.requestId).attributes.artifacts }}'
            policy: "${{ inputs.policy }}"
        dependsOn:
          - step: normalize-and-redact
            condition:
              type: succeeded
        weight: 0
        allowFailure: false
      - name: assert-request-contract
        description: Require the prepared request and launch-binding fields.
        task: { type: assert, expr: 'data.latest(inputs.assessmentModel, "request-" + inputs.requestId).attributes.requestId == inputs.requestId && has(data.latest(inputs.assessmentModel, "request-" + inputs.requestId).attributes.prompt) && has(data.latest(inputs.assessmentModel, "request-" + inputs.requestId).attributes.promptHash) && has(data.latest(inputs.assessmentModel, "request-" + inputs.requestId).attributes.cwd) && size(data.latest(inputs.assessmentModel, "request-" + inputs.requestId).attributes.prompt) > 0 && size(data.latest(inputs.assessmentModel, "request-" + inputs.requestId).attributes.promptHash) > 0 && size(data.latest(inputs.assessmentModel, "request-" + inputs.requestId).attributes.cwd) > 0', message: Prepared request resource is missing required launch binding., severity: high }
        dependsOn: [{ step: prepare, condition: { type: succeeded } }]
        weight: 0
        allowFailure: false
      - name: invoke-readonly-provider
        description: Invoke only the prepared redacted prompt in the required sandbox.
        task:
          type: model_method
          modelIdOrName: "${{ inputs.providerModel }}"
          methodName: invokeAndParse
          inputs:
            prompt: '${{ data.latest(inputs.assessmentModel, "request-" + inputs.requestId).attributes.prompt }}'
            invocationId: "${{ inputs.requestId }}"
            policy: "${{ inputs.policy }}"
            request: '${{ data.latest(inputs.assessmentModel, "request-" + inputs.requestId).attributes }}'
        dependsOn:
          - step: assert-request-contract
            condition:
              type: succeeded
        weight: 0
        allowFailure: false
      - name: assert-invocation-contract
        description: Require persisted invocation and launch claim binding and authority fields.
        task: { type: assert, expr: 'data.latest(inputs.providerModel, "invocation-" + inputs.requestId).attributes.invocationId == inputs.requestId && data.latest(inputs.providerModel, "invocation-" + inputs.requestId).attributes.success == true && data.latest(inputs.providerModel, "invocation-" + inputs.requestId).attributes.promptHash == data.latest(inputs.assessmentModel, "request-" + inputs.requestId).attributes.promptHash && data.latest(inputs.providerModel, "invocation-" + inputs.requestId).attributes.cwd == data.latest(inputs.assessmentModel, "request-" + inputs.requestId).attributes.cwd && has(data.latest(inputs.providerModel, "invocation-" + inputs.requestId).attributes.provider) && has(data.latest(inputs.providerModel, "invocation-" + inputs.requestId).attributes.model) && data.latest(inputs.providerModel, "invocation-" + inputs.requestId).attributes.parsedResponse.authority.disposition == "recommendation_only" && data.latest(inputs.providerModel, "invocation-" + inputs.requestId).attributes.parsedResponse.authority.sideEffects == "none" && data.latest(inputs.providerModel, "launch-claim-" + inputs.requestId).attributes.operation == "invokeAndParse" && data.latest(inputs.providerModel, "launch-claim-" + inputs.requestId).attributes.toolProfile == "readonly" && data.latest(inputs.providerModel, "launch-claim-" + inputs.requestId).attributes.sandbox == "required"', message: Invocation or launch claim violates required binding, readonly, or no-authority fields., severity: high }
        dependsOn: [{ step: invoke-readonly-provider, condition: { type: succeeded } }]
        weight: 0
        allowFailure: false
      - name: validate
        description: Verify redaction, invocation binding, evidence grounding, and zero authority.
        task:
          type: model_method
          modelIdOrName: "${{ inputs.assessmentModel }}"
          methodName: validate
          inputs:
            requestId: "${{ inputs.requestId }}"
            request: '${{ data.latest(inputs.assessmentModel, "request-" + inputs.requestId).attributes }}'
            agentOutput: '${{ data.latest(inputs.providerModel, "invocation-" + inputs.requestId).attributes.parsedResponse }}'
            invocation: '${{ data.latest(inputs.providerModel, "invocation-" + inputs.requestId).attributes }}'
            invocationClaim: '${{ data.latest(inputs.providerModel, "launch-claim-" + inputs.requestId).attributes }}'
            policy: "${{ inputs.policy }}"
        dependsOn:
          - step: assert-invocation-contract
            condition:
              type: succeeded
        weight: 0
        allowFailure: false
    dependsOn: []
    weight: 0
version: 1
