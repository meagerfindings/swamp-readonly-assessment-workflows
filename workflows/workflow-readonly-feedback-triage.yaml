id: 135fed50-b533-4365-8999-1fa0417714cf
name: "@mgreten/readonly-feedback-triage"
description: >-
  Deterministically normalize and redact feedback before a bounded,
  recommendation-only readonly triage, then fail closed on invalid evidence or
  authority-bearing output.
tags:
  capability: readonly-feedback-triage
  authority: none
inputs:
  additionalProperties: false
  properties:
    requestId:
      type: string
      minLength: 1
      maxLength: 90
      pattern: ^[A-Za-z0-9][A-Za-z0-9_-]*$
    assessmentModel:
      type: string
      minLength: 1
      maxLength: 128
      pattern: ^[A-Za-z0-9][A-Za-z0-9._-]*$
    providerModel:
      type: string
      minLength: 1
      maxLength: 128
      pattern: ^[A-Za-z0-9][A-Za-z0-9._-]*$
    envelopes:
      type: array
      minItems: 1
      maxItems: 50
      items:
        type: object
        minProperties: 1
  required: [requestId, assessmentModel, providerModel, envelopes]
jobs:
  - name: triage
    description: Redact raw feedback deterministically before any provider sees it.
    steps:
      - name: assert-input-scope
        description: Reject unsafe dynamic resource and model identifiers before any model dispatch.
        task: { type: assert, expr: 'inputs.requestId.matches("^[A-Za-z0-9][A-Za-z0-9_-]{0,89}$") && inputs.assessmentModel.matches("^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$") && inputs.providerModel.matches("^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$")', message: requestId or model identifier is outside the safe bounded identifier grammar., severity: high }
        dependsOn: []
        weight: 0
        allowFailure: false
      - name: normalize-and-redact
        description: Convert untrusted envelopes into bounded redacted artifacts without agent or provider tools.
        task:
          type: model_method
          modelIdOrName: "${{ inputs.assessmentModel }}"
          methodName: normalize
          inputs:
            requestId: "${{ inputs.requestId }}"
            envelopes: "${{ inputs.envelopes }}"
        dependsOn: [{ step: assert-input-scope, condition: { type: succeeded } }]
        weight: 0
        allowFailure: false
      - name: prepare
        description: Reject artifacts that violate redaction or bounds.
        task:
          type: model_method
          modelIdOrName: "${{ inputs.assessmentModel }}"
          methodName: prepare
          inputs:
            requestId: "${{ inputs.requestId }}"
            artifacts: '${{ data.latest(inputs.assessmentModel, "normalized-" + inputs.requestId).attributes.artifacts }}'
        dependsOn:
          - step: normalize-and-redact
            condition:
              type: succeeded
        weight: 0
        allowFailure: false
      - name: assert-request-contract
        description: Require the prepared request and launch-binding fields.
        task: { type: assert, expr: 'data.latest(inputs.assessmentModel, "request-" + inputs.requestId).attributes.requestId == inputs.requestId && has(data.latest(inputs.assessmentModel, "request-" + inputs.requestId).attributes.prompt) && has(data.latest(inputs.assessmentModel, "request-" + inputs.requestId).attributes.promptHash) && has(data.latest(inputs.assessmentModel, "request-" + inputs.requestId).attributes.agentCwd) && size(data.latest(inputs.assessmentModel, "request-" + inputs.requestId).attributes.prompt) > 0 && size(data.latest(inputs.assessmentModel, "request-" + inputs.requestId).attributes.promptHash) > 0 && size(data.latest(inputs.assessmentModel, "request-" + inputs.requestId).attributes.agentCwd) > 0', message: Prepared request resource is missing required launch binding., severity: high }
        dependsOn: [{ step: prepare, condition: { type: succeeded } }]
        weight: 0
        allowFailure: false
      - name: invoke-readonly-provider
        description: Invoke only the prepared redacted prompt in the required sandbox.
        task:
          type: model_method
          modelIdOrName: "${{ inputs.providerModel }}"
          methodName: invokeAndParse
          inputs:
            prompt: '${{ data.latest(inputs.assessmentModel, "request-" + inputs.requestId).attributes.prompt }}'
            invocationId: "${{ inputs.requestId }}"
            provider: amp
            cwd: '${{ data.latest(inputs.assessmentModel, "request-" + inputs.requestId).attributes.agentCwd }}'
            toolProfile: readonly
            sandboxMode: auto
            sandboxRequired: true
            sandboxNetwork: allow
            sandboxCredentialAccess: provider
        dependsOn:
          - step: assert-request-contract
            condition:
              type: succeeded
        weight: 0
        allowFailure: false
      - name: assert-invocation-contract
        description: Require persisted invocation and launch claim binding and authority fields.
        task: { type: assert, expr: 'data.latest(inputs.providerModel, "invocation-" + inputs.requestId).attributes.invocationId == inputs.requestId && data.latest(inputs.providerModel, "invocation-" + inputs.requestId).attributes.success == true && data.latest(inputs.providerModel, "invocation-" + inputs.requestId).attributes.promptHash == data.latest(inputs.assessmentModel, "request-" + inputs.requestId).attributes.promptHash && data.latest(inputs.providerModel, "invocation-" + inputs.requestId).attributes.cwd == data.latest(inputs.assessmentModel, "request-" + inputs.requestId).attributes.agentCwd && data.latest(inputs.providerModel, "invocation-" + inputs.requestId).attributes.provider == "amp" && has(data.latest(inputs.providerModel, "invocation-" + inputs.requestId).attributes.model) && data.latest(inputs.providerModel, "launch-claim-" + inputs.requestId).attributes.operation == "invokeAndParse" && data.latest(inputs.providerModel, "launch-claim-" + inputs.requestId).attributes.toolProfile == "readonly" && data.latest(inputs.providerModel, "launch-claim-" + inputs.requestId).attributes.sandbox.required == true && data.latest(inputs.providerModel, "launch-claim-" + inputs.requestId).attributes.sandbox.provider == "amp" && data.latest(inputs.providerModel, "launch-claim-" + inputs.requestId).attributes.sandbox.credentialAccess == "provider" && data.latest(inputs.providerModel, "launch-claim-" + inputs.requestId).attributes.sandbox.network == "allow"', message: Invocation or launch claim violates required binding or readonly fields., severity: high }
        dependsOn: [{ step: invoke-readonly-provider, condition: { type: succeeded } }]
        weight: 0
        allowFailure: false
      - name: validate
        description: Verify redaction, invocation binding, evidence grounding, and zero authority.
        task:
          type: model_method
          modelIdOrName: "${{ inputs.assessmentModel }}"
          methodName: validate
          inputs:
            requestId: "${{ inputs.requestId }}"
            request: '${{ data.latest(inputs.assessmentModel, "request-" + inputs.requestId).attributes }}'
            agentOutput: '${{ data.latest(inputs.providerModel, "invocation-" + inputs.requestId).attributes.parsedResponse }}'
            invocation: '${{ data.latest(inputs.providerModel, "invocation-" + inputs.requestId).attributes }}'
            invocationClaim: '${{ data.latest(inputs.providerModel, "launch-claim-" + inputs.requestId).attributes }}'
        dependsOn:
          - step: assert-invocation-contract
            condition:
              type: succeeded
        weight: 0
        allowFailure: false
    dependsOn: []
    weight: 0
version: 1
